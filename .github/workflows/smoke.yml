name: Check the checker

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run as a CLI
        run: python3 godot_csv_check.py tests/fixture
      - name: Run as a composite action
        uses: ./
        with:
          project-path: tests/fixture
